<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Laboratorios · Dra. Dal Maschio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D0A1E;--sf:#18112E;--sf2:#221840;--bd:rgba(176,107,255,.22);--tx:#F0EAFF;--mt:#9B84CC;--mt2:#6A538F;--ac:#B06BFF;--gn:#22D3A3;--rd:#FB2C5B;--am:#FBBF24;--grad:linear-gradient(135deg,#B06BFF,#F472B6);--rs:9px;--r:13px}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,#2D1060 0%,transparent 60%)}
.nav{position:sticky;top:0;z-index:100;background:rgba(13,10,30,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:12px 16px}
.nav-title{font-size:16px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-sub{font-size:11px;color:var(--mt);margin-top:1px}
main{padding:16px;max-width:600px;margin:0 auto}
.sec-ttl{font-size:11px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;margin-top:18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px}
.drug-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.drug-name{font-size:15px;font-weight:700;color:var(--tx)}
.drug-lab{font-size:11px;color:var(--mt);margin-top:2px}
.drug-marca{font-size:13px;color:var(--ac);font-weight:600;margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge-reset{background:rgba(34,211,163,.15);color:var(--gn);border:1px solid rgba(34,211,163,.3)}
.badge-count{background:rgba(176,107,255,.15);color:var(--ac);border:1px solid rgba(176,107,255,.3)}
.drug-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn-sm{background:none;border:1px solid var(--bd);color:var(--mt);padding:6px 12px;border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-sm:active{opacity:.7}
.btn-sm.green{border-color:rgba(34,211,163,.4);color:var(--gn)}
.btn-sm.purple{border-color:rgba(176,107,255,.4);color:var(--ac)}
.btn-sm.red{border-color:rgba(251,44,91,.4);color:var(--rd)}
.btn-add{width:100%;padding:13px;background:none;border:2px dashed var(--bd);border-radius:var(--r);color:var(--mt);font-size:14px;cursor:pointer;font-family:inherit;margin-top:6px;transition:all .15s}
.btn-add:active{border-color:var(--ac);color:var(--ac)}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:flex-end;justify-content:center}
.modal-ov.open{display:flex}
.modal-box{background:var(--bg);border-radius:18px 18px 0 0;padding:22px 18px 32px;width:100%;max-width:520px;border-top:1px solid var(--bd)}
.modal-ttl{font-size:15px;font-weight:700;margin-bottom:16px}
label{font-size:12px;color:var(--mt);display:block;margin:10px 0 4px}
input,textarea,select{width:100%;background:var(--sf);border:1.5px solid var(--bd);color:var(--tx);border-radius:var(--rs);font-size:14px;padding:10px 12px;font-family:inherit;outline:none;-webkit-appearance:auto;appearance:auto}
.btnp{background:var(--grad);color:#fff;border:none;padding:12px;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;font-family:inherit}
.back-btn{background:none;border:none;color:var(--mt);font-size:13px;cursor:pointer;padding:4px 0;margin-top:8px;width:100%;font-family:inherit}
.hist-item{font-size:12px;color:var(--mt);padding:5px 0;border-bottom:1px solid var(--bd)}
.hist-item:last-child{border:none}
.hist-date{color:var(--mt2);font-size:10px}
.empty{text-align:center;padding:40px 0;color:var(--mt);font-size:14px}
.stats-bar{display:flex;gap:8px;margin-bottom:16px}
.stat{flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:10px;text-align:center}
.stat-n{font-size:20px;font-weight:800;color:var(--ac)}
.stat-l{font-size:10px;color:var(--mt);margin-top:2px}
.search-inp{width:100%;background:var(--sf);border:1.5px solid var(--bd);color:var(--tx);border-radius:var(--rs);font-size:14px;padding:10px 14px;font-family:inherit;outline:none;margin-bottom:12px}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-title">🔬 Laboratorios</div>
  <div class="nav-sub">Dra. Dal Maschio · Seguimiento de fármacos</div>
</div>

<main>
  <input class="search-inp" type="text" id="srch" placeholder="Buscar fármaco o laboratorio..." oninput="render()">

  <div class="stats-bar">
    <div class="stat"><div class="stat-n" id="st-total">0</div><div class="stat-l">Fármacos</div></div>
    <div class="stat"><div class="stat-n" id="st-resets">0</div><div class="stat-l">Resets totales</div></div>
    <div class="stat"><div class="stat-n" id="st-recetas">0</div><div class="stat-l">Recetas totales</div></div>
  </div>

  <div class="sec-ttl">Fármacos registrados</div>
  <div id="lista"></div>
  <button class="btn-add" onclick="abrirModal()">+ Agregar fármaco</button>
</main>

<!-- Modal agregar/editar -->
<div class="modal-ov" id="modal-add">
  <div class="modal-box">
    <div class="modal-ttl" id="modal-ttl">Nuevo fármaco</div>
    <input type="hidden" id="m-id">
    <label>Nombre del fármaco (principio activo)</label>
    <input type="text" id="m-farmaco" placeholder="Ej: Levetiracetam">
    <label>Laboratorio</label>
    <input type="text" id="m-lab" placeholder="Ej: UCB Pharma">
    <label>Marca comercial que receto</label>
    <input type="text" id="m-marca" placeholder="Ej: Keppra">
    <label>Notas</label>
    <textarea id="m-notas" placeholder="Observaciones..." style="min-height:60px;resize:vertical"></textarea>
    <button class="btnp" onclick="guardarFarmaco()">Guardar</button>
    <button class="back-btn" onclick="cerrarModal('modal-add')">Cancelar</button>
  </div>
</div>

<!-- Modal registrar receta/reset -->
<div class="modal-ov" id="modal-acc">
  <div class="modal-box">
    <div class="modal-ttl" id="acc-ttl">Registrar acción</div>
    <input type="hidden" id="acc-id">
    <input type="hidden" id="acc-tipo">
    <label id="acc-lbl">Cantidad de recetas</label>
    <input type="number" id="acc-cant" placeholder="1" min="1" value="1">
    <label>Nota (opcional)</label>
    <input type="text" id="acc-nota" placeholder="Ej: Paciente García, control">
    <button class="btnp" onclick="guardarAccion()">Registrar</button>
    <button class="back-btn" onclick="cerrarModal('modal-acc')">Cancelar</button>
  </div>
</div>

<!-- Modal historial -->
<div class="modal-ov" id="modal-hist">
  <div class="modal-box" style="max-height:75vh;overflow-y:auto">
    <div class="modal-ttl" id="hist-ttl">Historial</div>
    <div id="hist-lista"></div>
    <button class="back-btn" onclick="cerrarModal('modal-hist')">Cerrar</button>
  </div>
</div>

<script>
const KEY='lab_farmacos_v1';

function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):[];}catch(e){return[];}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){alert('Sin espacio para guardar.');}}

function fmt(n){return new Date(n).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'});}

function render(){
  const datos=load();
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const fil=q?datos.filter(d=>d.farmaco.toLowerCase().includes(q)||d.lab.toLowerCase().includes(q)||d.marca.toLowerCase().includes(q)):datos;

  // Stats
  const totalResets=datos.reduce((a,d)=>a+(d.hist||[]).filter(h=>h.tipo==='reset').length,0);
  const totalRecetas=datos.reduce((a,d)=>a+(d.hist||[]).filter(h=>h.tipo==='receta').reduce((s,h)=>s+(h.cant||1),0),0);
  document.getElementById('st-total').textContent=datos.length;
  document.getElementById('st-resets').textContent=totalResets;
  document.getElementById('st-recetas').textContent=totalRecetas;

  if(!fil.length){
    document.getElementById('lista').innerHTML='<div class="empty">'+(q?'Sin resultados':'Sin fármacos registrados<br><small>Tocá + Agregar para empezar</small>')+'</div>';
    return;
  }

  document.getElementById('lista').innerHTML=fil.map(d=>{
    const hist=d.hist||[];
    const nRec=hist.filter(h=>h.tipo==='receta').reduce((a,h)=>a+(h.cant||1),0);
    const nReset=hist.filter(h=>h.tipo==='reset').length;
    const ultReset=hist.filter(h=>h.tipo==='reset').slice(-1)[0];
    return '<div class="card">'
      +'<div class="drug-header">'
      +'<div>'
      +'<div class="drug-name">'+d.farmaco+'</div>'
      +(d.lab?'<div class="drug-lab">🏭 '+d.lab+'</div>':'')
      +(d.marca?'<div class="drug-marca">📋 '+d.marca+'</div>':'')
      +(d.notas?'<div style="font-size:11px;color:var(--mt2);margin-top:3px">'+d.notas+'</div>':'')
      +'</div>'
      +'<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">'
      +'<span class="badge badge-count">💊 '+nRec+' recetas</span>'
      +'<span class="badge badge-reset">🔄 '+nReset+' resets</span>'
      +(ultReset?'<div style="font-size:10px;color:var(--mt2)">Último: '+fmt(ultReset.fecha)+'</div>':'')
      +'</div>'
      +'</div>'
      +'<div class="drug-actions">'
      +'<button class="btn-sm purple" onclick="abrirAccion(\''+d.id+'\',\'receta\')">💊 Registrar receta</button>'
      +'<button class="btn-sm green" onclick="abrirAccion(\''+d.id+'\',\'reset\')">🔄 Resetear</button>'
      +'<button class="btn-sm" onclick="verHistorial(\''+d.id+'\')">📋 Historial</button>'
      +'<button class="btn-sm" onclick="editarFarmaco(\''+d.id+'\')">✎ Editar</button>'
      +'<button class="btn-sm red" onclick="eliminarFarmaco(\''+d.id+'\')">🗑</button>'
      +'</div>'
      +'</div>';
  }).join('');
}

function abrirModal(id){
  const datos=load();
  const d=id?datos.find(x=>x.id===id):null;
  document.getElementById('modal-ttl').textContent=d?'Editar fármaco':'Nuevo fármaco';
  document.getElementById('m-id').value=d?d.id:'';
  document.getElementById('m-farmaco').value=d?d.farmaco:'';
  document.getElementById('m-lab').value=d?d.lab:'';
  document.getElementById('m-marca').value=d?d.marca:'';
  document.getElementById('m-notas').value=d?d.notas:'';
  document.getElementById('modal-add').classList.add('open');
  setTimeout(()=>document.getElementById('m-farmaco').focus(),80);
}
function editarFarmaco(id){abrirModal(id);}

function guardarFarmaco(){
  const datos=load();
  const id=document.getElementById('m-id').value;
  const farmaco=document.getElementById('m-farmaco').value.trim();
  if(!farmaco){alert('El nombre del fármaco es obligatorio');return;}
  const obj={
    id:id||Date.now().toString(),
    farmaco,
    lab:document.getElementById('m-lab').value.trim(),
    marca:document.getElementById('m-marca').value.trim(),
    notas:document.getElementById('m-notas').value.trim()
  };
  if(id){
    const idx=datos.findIndex(x=>x.id===id);
    if(idx!==-1){obj.hist=datos[idx].hist||[];datos[idx]=obj;}
  } else {
    obj.hist=[];
    datos.push(obj);
  }
  save(datos);
  cerrarModal('modal-add');
  render();
}

function abrirAccion(id,tipo){
  const datos=load();
  const d=datos.find(x=>x.id===id);
  document.getElementById('acc-id').value=id;
  document.getElementById('acc-tipo').value=tipo;
  document.getElementById('acc-ttl').textContent=tipo==='reset'?'🔄 Registrar reset — '+d.farmaco:'💊 Registrar receta — '+d.farmaco;
  document.getElementById('acc-lbl').textContent=tipo==='reset'?'¿Cuántas veces se reseteó hoy?':'Cantidad de recetas';
  document.getElementById('acc-cant').value=1;
  document.getElementById('acc-nota').value='';
  document.getElementById('modal-acc').classList.add('open');
  setTimeout(()=>document.getElementById('acc-cant').focus(),80);
}

function guardarAccion(){
  const datos=load();
  const id=document.getElementById('acc-id').value;
  const tipo=document.getElementById('acc-tipo').value;
  const cant=parseInt(document.getElementById('acc-cant').value)||1;
  const nota=document.getElementById('acc-nota').value.trim();
  const idx=datos.findIndex(x=>x.id===id);
  if(idx===-1)return;
  if(!datos[idx].hist)datos[idx].hist=[];
  datos[idx].hist.push({tipo,cant,nota,fecha:Date.now()});
  save(datos);
  cerrarModal('modal-acc');
  render();
  const msg=tipo==='reset'?'Reset registrado ✓':'Receta/s registrada/s ✓';
  alert(msg);
}

function verHistorial(id){
  const datos=load();
  const d=datos.find(x=>x.id===id);if(!d)return;
  const hist=(d.hist||[]).slice().reverse();
  document.getElementById('hist-ttl').textContent='📋 '+d.farmaco+' — Historial';
  document.getElementById('hist-lista').innerHTML=hist.length
    ?hist.map(h=>'<div class="hist-item"><div>'+(h.tipo==='reset'?'🔄 Reset':'💊 '+(h.cant||1)+' receta'+(h.cant>1?'s':''))+(h.nota?' · <em>'+h.nota+'</em>':'')+'</div><div class="hist-date">'+fmt(h.fecha)+'</div></div>').join('')
    :'<div class="empty">Sin registros todavía</div>';
  document.getElementById('modal-hist').classList.add('open');
}

function eliminarFarmaco(id){
  if(!confirm('¿Eliminar este fármaco y todo su historial?'))return;
  const datos=load().filter(x=>x.id!==id);
  save(datos);render();
}

function cerrarModal(id){document.getElementById(id).classList.remove('open');}

// Cerrar modal al tocar fondo
document.querySelectorAll('.modal-ov').forEach(ov=>{
  ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open');});
});

render();
</script>
</body>
</html>
