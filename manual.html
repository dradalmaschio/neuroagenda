<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Manual de Neurología · Dra. Dal Maschio</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#1F5C57;--teal-bg:#E8F1EF;--teal-bd:#9EC7C0;--amber:#B5571F;--amber-bg:#FBEFE6;--amber-bd:#E7B488;--slate:#5B6470;--slate-bg:#EEF0EE;--slate-bd:#C7CCC8;--ink:#1B2230;--ink2:#3B4350;--line:#DCE1DD;--bg:#F1F4F2;--panel:#fff;--green:#2F6E4F}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:15px;min-height:100vh}
a{text-decoration:none;color:inherit}

/* HEADER */
.hdr{background:var(--teal);color:#fff;padding:0}
.hdr-inner{max-width:900px;margin:0 auto;padding:18px 16px 14px}
.hdr-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#9EC7C0;margin-bottom:6px}
.hdr-title{font-family:'Source Serif 4',Georgia,serif;font-size:22px;font-weight:600;line-height:1.2;cursor:pointer}
.hdr-sub{font-size:12px;color:#B9C2BC;margin-top:4px}
.hdr-nav{display:flex;gap:8px;margin-top:14px}
.hdr-btn{background:rgba(255,255,255,.1);border:none;color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.hdr-btn.on,.hdr-btn:active{background:rgba(255,255,255,.25)}
.search-box{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:7px 12px;border-radius:8px;font-size:13px;width:100%;font-family:inherit;margin-top:10px;outline:none}
.search-box::placeholder{color:#9EC7C0}

/* MAIN */
.main{max-width:900px;margin:0 auto;padding:16px}

/* HOME — módulos */
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:600px){.mod-grid{grid-template-columns:1fr}}
.mod-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:box-shadow .15s;user-select:none}
.mod-card:active{box-shadow:0 0 0 2px var(--teal-bd)}
.mod-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--slate);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.mod-titulo{font-family:'Source Serif 4',Georgia,serif;font-size:15px;font-weight:600;color:var(--ink);line-height:1.3;margin-bottom:6px}
.mod-count{font-size:11px;color:var(--slate)}

/* MÓDULO — lista temas */
.back-btn{display:flex;align-items:center;gap:6px;color:var(--teal);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:14px;background:none;border:none;font-family:inherit}
.tema-list{display:flex;flex-direction:column;gap:6px}
.tema-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:box-shadow .15s}
.tema-item:active{box-shadow:0 0 0 2px var(--teal-bd)}
.tema-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate);min-width:24px;margin-top:1px}
.tema-info{}
.tema-titulo{font-size:14px;font-weight:500;color:var(--ink);line-height:1.3}
.tema-sub{font-size:12px;color:var(--slate);margin-top:2px}

/* TEMA — contenido */
.tema-header{margin-bottom:20px}
.tema-numero{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.tema-h1{font-family:'Source Serif 4',Georgia,serif;font-size:20px;font-weight:600;line-height:1.3;margin-bottom:4px}
.tema-h1-sub{font-size:13px;color:var(--slate)}

/* SECCIÓN */
.sec-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none}
.sec-hdr-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.sec-hdr-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;flex:1}
.sec-hdr-arr{font-size:12px;color:var(--slate);transition:transform .2s}
.sec-hdr-arr.open{transform:rotate(180deg)}
.sec-body{padding:0 14px 14px;display:none}
.sec-body.open{display:block}
.sec-intro{font-size:13.5px;color:var(--ink2);line-height:1.6;margin-bottom:10px;margin-top:10px}

/* BULLETS */
.blist{list-style:none;display:flex;flex-direction:column;gap:5px;margin-top:6px}
.blist li{display:flex;gap:8px;font-size:13.5px;color:var(--ink2);line-height:1.5}
.blist li::before{content:"•";color:var(--teal);flex-shrink:0;margin-top:1px}

/* TABLA */
.table-wrap{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--teal-bg);color:var(--teal);font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid var(--teal-bd)}
td{padding:7px 10px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top;line-height:1.4}
tr:last-child td{border-bottom:none}

/* NOTA */
.nota-box{background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px;color:var(--amber);line-height:1.5}
.nota-box-label{font-weight:600;margin-bottom:3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}

/* ACTUALIZACIÓN GUÍAS */
.guia-block{background:#FFF7ED;border:1px solid #F0C070;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px;line-height:1.5;color:#7C4F1A}
.guia-label{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;color:#B5571F}
.guia-item{display:flex;gap:6px;margin-bottom:4px}
.guia-tag{background:#B5571F;color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;margin-top:2px;white-space:nowrap}

/* SUBSECCIONES */
.sub-block{border:1px solid var(--line);border-radius:8px;margin-top:8px;overflow:hidden}
.sub-hdr{background:var(--slate-bg);padding:8px 12px;font-size:12px;font-weight:600;color:var(--slate);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.sub-body{padding:10px 12px;display:none}
.sub-body.open{display:block}

/* SEARCH RESULTS */
.search-res{display:flex;flex-direction:column;gap:6px}
.search-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
.search-item:active{border-color:var(--teal-bd)}
.search-mod{font-size:10px;color:var(--slate);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em;font-family:'IBM Plex Mono',monospace}
.search-titulo{font-size:14px;font-weight:500;color:var(--ink)}
.no-results{text-align:center;padding:32px;color:var(--slate);font-size:14px}

.tag-nuevo{display:inline-block;background:var(--amber);color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em;vertical-align:middle;margin-left:5px}
.tag-act{display:inline-block;background:var(--green);color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em;vertical-align:middle;margin-left:5px}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div class="hdr-eyebrow">Ayuda memoria de consultorio</div>

      <button class="hdr-btn" id="btn-home" onclick="goHome()">⌂ Inicio</button>

    <input class="search-box" id="search-input" placeholder="Buscar tema, diagnóstico, medicación..." style="display:none" oninput="doSearch(this.value)" autocomplete="off">
  </div>
</header>

<div class="main" id="main-content"></div>

const SECTION_ICONS = {
  sospecha_rapida: {icon:'⚡',color:'var(--amber)',bg:'var(--amber-bg)',bd:'var(--amber-bd)',label:'Sospecha rápida'},
  clinica: {icon:'🩺',color:'var(--teal)',bg:'var(--teal-bg)',bd:'var(--teal-bd)',label:'Clínica'},
  diagnostico: {icon:'📋',color:'var(--teal)',bg:'var(--teal-bg)',bd:'var(--teal-bd)',label:'Diagnóstico'},
  diagnostico_diferencial: {icon:'⚖️',color:'var(--slate)',bg:'var(--slate-bg)',bd:'var(--slate-bd)',label:'Diagnóstico diferencial'},
  estudios: {icon:'🧪',color:'var(--teal)',bg:'var(--teal-bg)',bd:'var(--teal-bd)',label:'Estudios'},
  neuroimagen_funcional: {icon:'🔬',color:'var(--teal)',bg:'var(--teal-bg)',bd:'var(--teal-bd)',label:'Neuroimagen funcional'},
  tratamiento: {icon:'💊',color:'var(--teal)',bg:'var(--teal-bg)',bd:'var(--teal-bd)',label:'Tratamiento'},
  seguimiento: {icon:'📅',color:'var(--slate)',bg:'var(--slate-bg)',bd:'var(--slate-bd)',label:'Seguimiento'},
  actualizacion_guias: {icon:'🔄',color:'var(--amber)',bg:'var(--amber-bg)',bd:'var(--amber-bd)',label:'Actualización de guías'},
};

let currentView = 'home';
let currentModule = null;
let currentTema = null;
let searchOpen = false;

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderHome() {
  currentView = 'home';
  document.getElementById('btn-home').classList.add('on');
  const mods = MANUAL_DATA.modulos;
  let h = '<div class="mod-grid">';
  mods.forEach((m,i) => {
    h += `<div class="mod-card" onclick="goModule('${m.id}')">
      <div class="mod-num">Módulo ${i+1}</div>
      <div class="mod-titulo">${esc(m.titulo)}</div>
      <div class="mod-count">${m.temas.length} tema${m.temas!==1?'s':''}</div>
    </div>`;
  });
  h += '</div>';
  setMain(h);
}

function goModule(modId) {
  currentView = 'module';
  currentModule = MANUAL_DATA.modulos.find(m=>m.id===modId);
  if(!currentModule) return;
  let h = `<button class="back-btn" onclick="renderHome()">← Volver</button>`;
  h += `<div style="font-family:'Source Serif 4',Georgia,serif;font-size:18px;font-weight:600;margin-bottom:14px;color:var(--ink)">${esc(currentModule.titulo)}</div>`;
  h += '<div class="tema-list">';
  currentModule.temas.forEach(t => {
    h += `<div class="tema-item" onclick="goTema('${currentModule.id}','${t.id}')">
      <div class="tema-num">${String(t.numero).padStart(2,'0')}</div>
      <div class="tema-info">
        <div class="tema-titulo">${esc(t.titulo)}</div>
        ${t.subtitulo?`<div class="tema-sub">${esc(t.subtitulo)}</div>`:''}
      </div>
    </div>`;
  });
  h += '</div>';
  setMain(h);
}

function goTema(modId, temaId) {
  currentView = 'tema';
  const mod = MANUAL_DATA.modulos.find(m=>m.id===modId);
  if(!mod) return;
  const tema = mod.temas.find(t=>t.id===temaId);
  if(!tema) return;
  currentModule = mod;
  currentTema = tema;

  let h = `<button class="back-btn" onclick="goModule('${modId}')">← ${esc(mod.titulo)}</button>`;
  h += `<div class="tema-header">
    <div class="tema-numero">Tema ${tema.numero}</div>
    <div class="tema-h1">${esc(tema.titulo)}</div>
    ${tema.subtitulo?`<div class="tema-h1-sub">${esc(tema.subtitulo)}</div>`:''}
  </div>`;

  if(tema.secciones) {
    tema.secciones.forEach((sec,si) => {
      h += renderSeccion(sec, `${temaId}_${si}`);
    });
  }
  setMain(h);
  window.scrollTo(0,0);
}

function renderSeccion(sec, uid) {
  const meta = SECTION_ICONS[sec.tipo] || {icon:'📄',color:'var(--slate)',bg:'var(--slate-bg)',bd:'var(--slate-bd)',label:sec.tipo};
  let inner = '';

  if(sec.intro) inner += `<div class="sec-intro">${esc(sec.intro)}</div>`;
  if(sec.bullets) inner += renderBullets(sec.bullets);
  if(sec.tabla) inner += renderTabla(sec.tabla);
  if(sec.nota_clinica) inner += `<div class="nota-box"><div class="nota-box-label">Nota clínica</div>${esc(sec.nota_clinica)}</div>`;
  if(sec.nota) inner += `<div class="nota-box"><div class="nota-box-label">Nota</div>${esc(sec.nota)}</div>`;
  if(sec.texto) inner += `<div class="sec-intro">${esc(sec.texto)}</div>`;

  // Neuroimagen funcional subsección
  if(sec.neuroimagen_funcional) {
    const nf = sec.neuroimagen_funcional;
    let nfh = '';
    if(nf.indicacion) nfh += `<div class="sec-intro">${esc(nf.indicacion)}</div>`;
    if(nf.tabla) nfh += renderTabla(nf.tabla);
    inner += renderSubSeccion('Neuroimagen funcional', nfh, uid+'_nf');
  }

  // Actualización guías
  if(sec.actualizacion_guias) {
    const ag = sec.actualizacion_guias;
    let agh = '<div class="guia-label">Actualización de guías</div>';
    if(Array.isArray(ag)) {
      ag.forEach(item => {
        agh += `<div class="guia-item"><span class="guia-tag">${esc(item.tipo||'GUÍA')}</span><span>${esc(item.texto||item.descripcion||JSON.stringify(item))}</span></div>`;
      });
    } else if(typeof ag === 'object') {
      Object.entries(ag).forEach(([k,v]) => {
        if(typeof v === 'string') agh += `<div class="guia-item"><span class="guia-tag">${esc(k)}</span><span>${esc(v)}</span></div>`;
        else if(Array.isArray(v)) v.forEach(item => {
          agh += `<div class="guia-item"><span class="guia-tag">${esc(k)}</span><span>${esc(typeof item==='string'?item:JSON.stringify(item))}</span></div>`;
        });
      });
    }
    inner += `<div class="guia-block">${agh}</div>`;
  }

  // Subsecciones
  if(sec.subsecciones) {
    sec.subsecciones.forEach((sub,si) => {
      let sh = '';
      if(sub.bullets) sh += renderBullets(sub.bullets);
      if(sub.tabla) sh += renderTabla(sub.tabla);
      if(sub.texto) sh += `<div class="sec-intro">${esc(sub.texto)}</div>`;
      if(sub.nota) sh += `<div class="nota-box"><div class="nota-box-label">Nota</div>${esc(sub.nota)}</div>`;
      if(sub.secciones) sub.secciones.forEach(ss => { sh += renderSeccionSimple(ss); });
      inner += renderSubSeccion(sub.titulo||sub.label||'', sh, uid+'_sub'+si);
    });
  }
  if(sec.secciones) {
    sec.secciones.forEach((sub,si) => {
      inner += renderSeccionSimple(sub, uid+'_s'+si);
    });
  }

  // Farmacológico / no farmacológico
  ['farmacologico','no_farmacologico','terapias_modificadoras','orden_reduccion'].forEach(k => {
    if(sec[k]) {
      let sh = '';
      const val = sec[k];
      if(typeof val === 'string') sh = `<div class="sec-intro">${esc(val)}</div>`;
      else if(Array.isArray(val)) sh = renderBullets(val);
      else if(val.bullets) sh = renderBullets(val.bullets);
      inner += renderSubSeccion(k.replace(/_/g,' '), sh, uid+'_'+k);
    }
  });

  if(!inner) return '';

  const sid = 'sec_'+uid;
  return `<div class="sec-block">
    <div class="sec-hdr" onclick="toggleSec('${sid}')">
      <div class="sec-hdr-icon" style="background:${meta.bg};color:${meta.color}">${meta.icon}</div>
      <div class="sec-hdr-label" style="color:${meta.color}">${meta.label}</div>
      ${sec.titulo&&sec.titulo!==meta.label?`<div style="font-size:12px;color:var(--ink2);flex:2">${esc(sec.titulo)}</div>`:''}
      <div class="sec-hdr-arr" id="arr_${sid}">▾</div>
    </div>
    <div class="sec-body" id="${sid}">${inner}</div>
  </div>`;
}

function renderSeccionSimple(sec, uid='') {
  let h = '';
  if(sec.titulo) h += `<div style="font-size:12px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 4px">${esc(sec.titulo)}</div>`;
  if(sec.intro) h += `<div class="sec-intro">${esc(sec.intro)}</div>`;
  if(sec.bullets) h += renderBullets(sec.bullets);
  if(sec.tabla) h += renderTabla(sec.tabla);
  if(sec.texto) h += `<div class="sec-intro">${esc(sec.texto)}</div>`;
  if(sec.nota) h += `<div class="nota-box"><div class="nota-box-label">Nota</div>${esc(sec.nota)}</div>`;
  return h;
}

function renderSubSeccion(titulo, inner, uid) {
  if(!inner) return '';
  return `<div class="sub-block">
    <div class="sub-hdr" onclick="toggleSub('${uid}')">
      <span>${esc(titulo)}</span><span id="subarr_${uid}">▾</span>
    </div>
    <div class="sub-body" id="subbody_${uid}">${inner}</div>
  </div>`;
}

function renderBullets(arr) {
  if(!arr||!arr.length) return '';
  let h = '<ul class="blist">';
  arr.forEach(item => {
    if(typeof item === 'string') h += `<li><span>${esc(item)}</span></li>`;
    else if(typeof item === 'object') {
      const text = item.texto||item.label||JSON.stringify(item);
      const tag = item.tipo||item.tag||'';
      h += `<li><span>${tag?`<span class="tag-nuevo">${esc(tag)}</span> `:''}${esc(text)}</span></li>`;
    }
  });
  h += '</ul>';
  return h;
}

function renderTabla(tabla) {
  if(!tabla) return '';
  let h = '<div class="table-wrap"><table><thead><tr>';
  (tabla.columnas||[]).forEach(c => { h += `<th>${esc(c)}</th>`; });
  h += '</tr></thead><tbody>';
  (tabla.filas||[]).forEach(row => {
    h += '<tr>';
    (Array.isArray(row)?row:[row]).forEach(cell => { h += `<td>${esc(cell)}</td>`; });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function toggleSec(id) {
  const body = document.getElementById(id);
  const arr = document.getElementById('arr_'+id);
  if(!body) return;
  const open = body.classList.toggle('open');
  if(arr) arr.textContent = open ? '▴' : '▾';
}

function toggleSub(id) {
  const body = document.getElementById('subbody_'+id);
  const arr = document.getElementById('subarr_'+id);
  if(!body) return;
  const open = body.classList.toggle('open');
  if(arr) arr.textContent = open ? '▴' : '▾';
}

function setMain(html) {
  document.getElementById('main-content').innerHTML = html;
}

function goHome() {
  if(searchOpen) toggleSearch();
  renderHome();
}

function toggleSearch() {
  searchOpen = !searchOpen;
  const inp = document.getElementById('search-input');
  const btn = document.getElementById('btn-search');
  inp.style.display = searchOpen ? '' : 'none';
  btn.classList.toggle('on', searchOpen);
  if(searchOpen) { inp.value=''; inp.focus(); renderHome(); }
}

function doSearch(q) {
  if(!q||q.length<2) { renderHome(); return; }
  const qn = q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const results = [];
  MANUAL_DATA.modulos.forEach(mod => {
    mod.temas.forEach(tema => {
      const text = JSON.stringify(tema).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if(text.includes(qn)) results.push({mod, tema});
    });
  });
  if(!results.length) {
    setMain(`<div class="no-results">Sin resultados para "${esc(q)}"</div>`);
    return;
  }
  let h = `<div style="font-size:12px;color:var(--slate);margin-bottom:10px">${results.length} resultado${results.length!==1?'s':''}</div><div class="search-res">`;
  results.forEach(({mod,tema}) => {
    h += `<div class="search-item" onclick="goTema('${mod.id}','${tema.id}')">
      <div class="search-mod">${esc(mod.titulo)}</div>
      <div class="search-titulo">${String(tema.numero).padStart(2,'0')} · ${esc(tema.titulo)}</div>
    </div>`;
  });
  h += '</div>';
  setMain(h);
}

// Init
renderHome();
</script>
</body>
</html>
