function normalize(s) {
  return (s || "")
    .toString()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

// Recolecta todo el texto de un nodo (tema completo) para indexar búsqueda
function collectText(node, acc) {
  if (node == null) return;
  if (typeof node === "string") { acc.push(node); return; }
  if (Array.isArray(node)) { node.forEach((n) => collectText(n, acc)); return; }
  if (typeof node === "object") {
    Object.entries(node).forEach(([k, v]) => {
      if (k === "id" || k === "numero" || k === "tipo") return;
      collectText(v, acc);
    });
  }
}

  "WAIS-IV": "wais",
  "Hoehn y Yahr": "hoehnyahr",
  "Schwab & England": "schwabengland",

  UHDRS: "uhdrs",
  IRLS: "irls",
  "GAD-7": "gad7",
  DIVA: "diva",
};
const SCALE_SPLIT_RE = /(\bMMSE\b|\bGDS\b|\bHADS\b|\bPHQ-9\b|\bHamilton\b|\bFazekas\b|\bScheltens\b|\bMTA\b|\bUPDRS\b|\bMoCA\b|\bFigura Compleja de Rey-Osterrieth\b|\bFigura de Rey\b|\bTest del reloj\b|\bTest de Bender\b|\bCDR\b|\bLawton-Brody\b|\bBarthel\b|\bNPI\b|\bZarit\b|\bFAB\b|\bCAM\b|\bIQCODE\b|\bAQ\b|\bRAADS-R\b|\bADOS-2\b|\bADI-R\b|\bASRS\b|\bWender Utah\b|\bCAARS\b|\bWAIS-IV\b|\bHoehn y Yahr\b|\bSchwab & England\b|\bFahn-Tolosa-Marin\b|\bAIMS\b|\bYGTSS\b|\bUHDRS\b|\bIRLS\b|\bGAD-7\b|\bDIVA\b)/;

const ScaleContext = createContext(() => {});

function linkifyScales(text, openScale) {
  if (typeof text !== "string" || !text) return text;
  const parts = text.split(SCALE_SPLIT_RE);
  if (parts.length === 1) return text;
  return parts.map((part, i) => {
    const id = SCALE_TOKEN_TO_ID[part];
    if (id) {
      return (
        <button
          key={i}
          type="button"
          onClick={(e) => {
            e.stopPropagation();
            openScale(id);
          }}
          className="underline decoration-dotted decoration-[#1F5C57] text-[#1F5C57] font-semibold hover:bg-[#E8F1EF] rounded px-0.5 -mx-0.5"
        >
          {part}
        </button>
      );
    }
    return part;
  });
}

function Linked({ text }) {
  const openScale = useContext(ScaleContext);
  return <>{linkifyScales(text, openScale)}</>;
}

function humanizeKey(key) {
  if (key in KEY_LABELS) return KEY_LABELS[key];
  return key
    .split("_")
    .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
    .join(" ");
}

// Render recursivo genérico de un "nodo" de sección (maneja toda la variedad de formas del JSON)
function Block({ node, depth = 0, stepNumber = null }) {
  if (node == null) return null;

  if (Array.isArray(node)) {
    return (
      <div className="space-y-4">
        {node.map((item, i) => (
          <Block key={i} node={item} depth={depth} />
        ))}
      </div>
    );
  }

  if (typeof node !== "object") return null;

  const meta = node.tipo ? SECTION_META[node.tipo] : null;
  const isSubtema = node.tipo === "subtema";

  const consumedKeys = new Set([
    "tipo", "titulo", "subtitulo", "id", "numero", "texto", "intro",
    "bullets", "tabla", "alertas", "nota", "nota_clinica", "orden_reduccion",
    "destacado", "estado",
  ]);

  const remainingEntries = Object.entries(node).filter(
    ([k]) => !consumedKeys.has(k)
  );

  return (
    <div className={depth === 0 ? "mb-7" : "mb-4"}>
      {(node.titulo || meta) && (
        <div className="flex items-center gap-2 mb-2.5">
          {depth === 0 && stepNumber && (
            <span
              className="text-[11px] font-semibold text-white bg-[#1F5C57] rounded-md w-6 h-6 flex items-center justify-center shrink-0"
              style={{ fontFamily: "'IBM Plex Mono', monospace" }}
            >
              {String(stepNumber).padStart(2, "0")}
            </span>
          )}
          {meta && meta.icon && depth === 0 && !stepNumber && (
            <Icon name={meta.icon} size={16} className={ACCENT_CLASSES[meta.accent].text} />
          )}
          {isSubtema ? (
            <h4
              className="text-[15px] font-semibold text-[#1B2230]"
              style={{ fontFamily: "'Source Serif 4', Georgia, serif" }}
            >
              {node.titulo}
            </h4>
          ) : (
            <h3
              className={depth === 0 ? "text-[15px] font-semibold text-[#1B2230] tracking-tight" : "text-[13.5px] font-semibold text-[#3B4350] uppercase tracking-wide"}
              style={depth === 0 ? { fontFamily: "'Source Serif 4', Georgia, serif" } : { fontFamily: "'IBM Plex Mono', monospace", fontSize: "11.5px" }}
            >
              {node.titulo || (meta && meta.label)}
            </h3>
          )}
        </div>
      )}

      {node.destacado && (
        <p className="text-[12px] uppercase tracking-wide text-[#B5571F] font-semibold mb-2" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
          ★ {node.destacado}
        </p>
      )}

      {node.subtitulo && (
        <p className="text-[13.5px] text-[#6B7480] italic mb-2 -mt-1">{node.subtitulo}</p>
      )}

      {(node.texto || node.intro) && (
        <p className="text-[14px] text-[#2A3038] leading-relaxed mb-2">
          <Linked text={node.texto || node.intro} />
        </p>
      )}

      <Bullets items={node.bullets} />
      <Table tabla={node.tabla} />
      <OrderedList items={node.orden_reduccion} />
      <Alertas items={node.alertas} />
      <Note text={node.nota_clinica} label="Nota clínica" />
      <Note text={node.nota} label="Nota" />

      {remainingEntries.map(([key, value]) => {
        if (value == null) return null;
        if (typeof value === "string") {
          return <Note key={key} text={value} label={humanizeKey(key)} />;
        }
        const label = humanizeKey(key);
        const childHasOwnTitle = !Array.isArray(value) && value && value.titulo;
        return (
          <div key={key} className="mt-3">
            {label && !childHasOwnTitle && (
              <div
                className="text-[11.5px] font-semibold text-[#1F5C57] uppercase tracking-wide mb-1.5"
                style={{ fontFamily: "'IBM Plex Mono', monospace" }}
              >
                {label}
              </div>
            )}
            <Block node={value} depth={depth + 1} />
          </div>
        );
      })}
    </div>
  );
}

                        <p
                          className="text-[11.5px] text-[#6B7480] mt-0.5"
                          style={{ fontFamily: "'IBM Plex Mono', monospace" }}
                        >
                          {s.puntuacion_total}
                        </p>
                      )}
                    </div>
                    <Icon name="chevron-right" size={16} className="text-[#9EC7C0] shrink-0" />
                  </button>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
function ResultCard({ r, onSelect }) {
  return (
    <button
      onClick={() => onSelect(r.moduleId, r.temaId)}
      className="text-left bg-white rounded-xl border border-[#DCE1DD] p-4 hover:border-[#9EC7C0] hover:shadow-sm transition-all"
    >
      <span className="text-[10px] uppercase tracking-wide text-[#1F5C57] font-semibold" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
        {r.moduleTitulo}
      </span>
      <h3 className="text-[15px] font-semibold text-[#1B2230] mt-1" style={{ fontFamily: "'Source Serif 4', Georgia, serif" }}>
        {r.titulo}
      </h3>
      {r.subtitulo && <p className="text-[12.5px] text-[#6B7480] italic mt-0.5">{r.subtitulo}</p>}
    </button>
  );
}

function SearchPage({ flatIndex, onSelect, onClose }) {
  const [query, setQuery] = useState("");
  const inputRef = useRef(null);

  useEffect(() => {
    const id = setTimeout(() => inputRef.current && inputRef.current.focus(), 50);
    return () => clearTimeout(id);
  }, []);

  const results = useMemo(() => {
    const q = normalize(query.trim());
    if (!q) return null;
    const terms = q.split(/\s+/).filter(Boolean);
    return flatIndex.filter((item) => terms.every((t) => item.searchText.includes(t)));
  }, [query, flatIndex]);

  return (
    <div className="fixed inset-0 z-50 bg-[#F1F4F2] overflow-y-auto" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
      <div className="bg-[#1B2230] px-5 py-5 sticky top-0 z-10">
        <div className="max-w-3xl mx-auto flex items-center gap-3">
          <button onClick={onClose} className="text-[#D7DCD8] hover:text-white shrink-0 p-1">
            <Icon name="arrow-left" size={20} />
          </button>
          <div className="relative flex-1">
            <Icon name="search" size={17} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#8A9088]" />
            <input
              ref={inputRef}
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Buscar tema, síntoma o fármaco…"
              className="w-full bg-white rounded-xl pl-10 pr-9 py-3 text-[14.5px] text-[#1B2230] placeholder:text-[#9CA39E] outline-none ring-2 ring-transparent focus:ring-[#9EC7C0] transition-shadow"
            />
            {query && (
              <button
                onClick={() => setQuery("")}
                className="absolute right-3 top-1/2 -translate-y-1/2 text-[#9CA39E] hover:text-[#1B2230]"
              >
                <Icon name="x" size={16} />
              </button>
            )}
          </div>
        </div>
      </div>

      <div className="max-w-3xl mx-auto px-5 py-6">
        {results === null ? (
          <p className="text-[13.5px] text-[#8A9088]">Empezá a escribir para buscar entre los 24 temas del manual.</p>
        ) : results.length === 0 ? (
          <p className="text-[14px] text-[#6B7480]">Sin coincidencias. Probá con otro término.</p>
        ) : (
          <>
            <p
              className="text-[12.5px] text-[#6B7480] mb-4 uppercase tracking-wide"
              style={{ fontFamily: "'IBM Plex Mono', monospace" }}
            >
              {results.length} resultado{results.length !== 1 ? "s" : ""}
            </p>
            <div className="grid sm:grid-cols-2 gap-3">
              {results.map((r) => (
                <ResultCard key={r.moduleId + r.temaId} r={r} onSelect={onSelect} />
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const data = MANUAL_DATA;
  const [view, setView] = useState("home"); // 'home' | 'modulo1' | 'modulo2' | 'novedades'
  const [selectedId, setSelectedId] = useState(data.modulos[0].temas[0].id);
  const [searchOpen, setSearchOpen] = useState(false);
  const [mobileIndexOpen, setMobileIndexOpen] = useState(false);
  const [activeScaleId, setActiveScaleId] = useState(null);

  const flatIndex = useMemo(() => {
    const out = [];
    data.modulos.forEach((m) => {
      m.temas.forEach((t) => {
        const acc = [];
        collectText(t, acc);
        out.push({
          moduleId: m.id,
          moduleTitulo: m.titulo,
          temaId: t.id,
          numero: t.numero,
          titulo: t.titulo,
          subtitulo: t.subtitulo || "",
          searchText: normalize([t.titulo, t.subtitulo, ...acc].join(" ")),
        });
      });
    });
    return out;
  }, [data]);

  const currentModule =
    view === "modulo1" || view === "modulo2" ? data.modulos.find((m) => m.id === view) : null;
  const currentTema =
    currentModule && currentModule.temas.find((t) => t.id === selectedId);

  function selectTema(moduleId, temaId) {
    setView(moduleId);
    setSelectedId(temaId);
    setSearchOpen(false);
    setMobileIndexOpen(false);
  }

  function handleHomeNavigate(id) {
    if (id === "search") {
      setSearchOpen(true);
      return;
    }
    setView(id);
    if (id !== "novedades" && id !== "escalas") {
      const m = data.modulos.find((mm) => mm.id === id);
      setSelectedId(m.temas[0].id);
    }
  }

  const moduleLabel = {
    modulo1: "Demencias",
    modulo2: "Movimientos Anormales",
    novedades: "Novedades",
    escalas: "Escalas clínicas",
  }[view];

  return (
    <ScaleContext.Provider value={setActiveScaleId}>
    <div className="min-h-screen bg-[#F1F4F2]" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
        * { box-sizing: border-box; }
        ::selection { background: #9EC7C0; color: #1B2230; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #C7CCC8; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        @media (prefers-reduced-motion: reduce) {
          * { animation: none !important; transition: none !important; }
        }
      `}</style>

      {activeScaleId && (
        <ScaleModal scaleId={activeScaleId} onClose={() => setActiveScaleId(null)} />
      )}

      {searchOpen && (
        <SearchPage
          flatIndex={flatIndex}
          onSelect={selectTema}
          onClose={() => setSearchOpen(false)}
        />
      )}

      {/* HEADER */}
      <header className="bg-[#1B2230] relative overflow-hidden">
        <svg
          className="absolute bottom-0 left-0 w-full opacity-[0.18]"
          height="36"
          viewBox="0 0 1200 36"
          preserveAspectRatio="none"
        >
          <path
            d="M0,18 L80,18 L95,4 L110,32 L125,18 L200,18 L215,10 L230,26 L245,18 L340,18 L355,2 L372,34 L388,18 L480,18 L495,12 L510,24 L525,18 L620,18 L635,6 L650,30 L665,18 L760,18 L775,14 L790,22 L805,18 L900,18 L915,4 L930,32 L945,18 L1040,18 L1055,10 L1070,26 L1085,18 L1200,18"
            fill="none"
            stroke="#9EC7C0"
            strokeWidth="1.5"
          />
        </svg>
        <div className="relative max-w-6xl mx-auto px-5 pt-7 pb-9">
          <div className="flex items-center justify-between flex-wrap gap-4">
            <div>
              <div className="flex items-center gap-2 mb-1.5">
                <Icon name="book-open" size={15} className="text-[#9EC7C0]" />
                <span
                  className="text-[11px] uppercase tracking-[0.12em] text-[#9EC7C0] font-medium"
                  style={{ fontFamily: "'IBM Plex Mono', monospace" }}
                >
                  Ayuda memoria de consultorio
                </span>
              </div>
              <button onClick={() => setView("home")} className="text-left">
                <h1
                  className="text-[26px] sm:text-[30px] font-semibold text-white leading-tight"
                  style={{ fontFamily: "'Source Serif 4', Georgia, serif" }}
                >
                  Manual de Neurología Clínica
                </h1>
              </button>
              <p className="text-[13px] text-[#B9C2BC] mt-1">
                Dra. Sandra Beatriz Dal Maschio · Médica Neuróloga
                {moduleLabel && <span className="text-[#6F7E78]"> · {moduleLabel}</span>}
              </p>
            </div>

            <div className="flex items-center gap-2.5">
              <button
                onClick={() => setView("home")}
                title="Inicio"
                className={
                  "flex items-center justify-center w-9 h-9 rounded-lg transition-colors " +
                  (view === "home" ? "bg-white text-[#1B2230]" : "bg-white/5 text-[#D7DCD8] hover:bg-white/10")
                }
              >
                <Icon name="home" size={16} />
              </button>
              <button
                onClick={() => setSearchOpen(true)}
                title="Buscar"
                className="flex items-center justify-center w-9 h-9 rounded-lg bg-white/5 text-[#D7DCD8] hover:bg-white/10 transition-colors"
              >
                <Icon name="search" size={16} />
              </button>
            </div>
          </div>
        </div>
      </header>

      {/* BODY */}
      <div className="max-w-6xl mx-auto px-5 py-7">
        {view === "home" ? (
          <HomeView onNavigate={handleHomeNavigate} />
        ) : view === "novedades" ? (
          <NovedadesView data={data} />
        ) : view === "escalas" ? (
          <ScalesLibraryView onOpenScale={setActiveScaleId} />
        ) : (
          <div className="flex flex-col md:flex-row gap-5 md:gap-7">
            {/* SIDEBAR */}
            <button
              onClick={() => setMobileIndexOpen((v) => !v)}
              className="md:hidden flex items-center gap-2 text-[13px] font-medium text-[#1F5C57] mb-3"
            >
              <Icon name="menu" size={16} /> Índice de temas
            </button>
            <aside
              className={
                (mobileIndexOpen ? "block" : "hidden") +
                " md:block w-full md:w-[260px] shrink-0"
              }
            >
              <div className="md:sticky md:top-6">
                <p
                  className="text-[11px] uppercase tracking-wide text-[#8A9088] font-semibold mb-2.5 px-1"
                  style={{ fontFamily: "'IBM Plex Mono', monospace" }}
                >
                  {currentModule.titulo}
                </p>
                <nav className="space-y-0.5 max-h-[70vh] overflow-y-auto scrollbar-thin pr-1">
                  {currentModule.temas.map((t) => (
                    <button
                      key={t.id}
                      onClick={() => selectTema(currentModule.id, t.id)}
                      className={
                        "w-full text-left flex items-start gap-2 px-2.5 py-2 rounded-lg text-[13px] transition-colors " +
                        (selectedId === t.id
                          ? "bg-white shadow-sm text-[#1B2230] font-medium"
                          : "text-[#5B6470] hover:bg-white/60")
                      }
                    >
                      <span
                        className={"shrink-0 mt-[1px] " + (selectedId === t.id ? "text-[#1F5C57]" : "text-[#9CA39E]")}
                        style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: "11px" }}
                      >
                        {String(t.numero).padStart(2, "0")}
                      </span>
                      <span className="leading-snug">{t.titulo}</span>
                    </button>
                  ))}
                </nav>
              </div>
            </aside>

            {/* CONTENIDO */}
            <main className="flex-1 min-w-0 bg-white rounded-2xl border border-[#E3E7E3] p-6 sm:p-9">
              {currentTema && <TemaFicha tema={currentTema} />}
            </main>
          </div>
        )}
      </div>

      <footer className="max-w-6xl mx-auto px-5 pb-8 pt-2">
        <p className="text-[11.5px] text-[#9CA39E]">
          Manual de uso personal para consultorio — no reemplaza el juicio clínico ni las guías de práctica vigentes.
        </p>
      </footer>
    </div>
    </ScaleContext.Provider>
  );
}

const __root = ReactDOM.createRoot(document.getElementById("root"));
__root.render(<App />);
</script>
</body>
</html>
