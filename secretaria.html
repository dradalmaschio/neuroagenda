<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Secretari@ · Dra. Dal Maschio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D0A1E;--sf:#18112E;--sf2:#221840;--bd:rgba(176,107,255,.22);--tx:#F0EAFF;--mt:#9B84CC;--mt2:#6A538F;--ac:#B06BFF;--gn:#22D3A3;--rd:#FB2C5B;--am:#FBBF24;--grad:linear-gradient(135deg,#B06BFF,#F472B6);--rs:9px;--r:13px}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,#2D1060 0%,transparent 60%)}
.nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(13,10,30,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(176,107,255,.25)}
.nav-inner{padding:10px 14px 6px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:16px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand-sub{font-size:11px;color:var(--mt)}
.tabs{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;padding:0 8px 6px;border-top:1px solid rgba(176,107,255,.15)}
.tab{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:500;border:none;background:none;color:var(--mt);cursor:pointer;white-space:nowrap;font-family:inherit}
.tab.on{color:#fff;background:var(--grad);box-shadow:0 2px 12px rgba(176,107,255,.4)}
main{padding:16px;margin-top:84px}
.view{display:none}.view.on{display:block}
.sec-ttl{font-size:11px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;margin-top:16px}
input,textarea,select{width:100%;background:var(--sf);border:1.5px solid var(--bd);color:var(--tx);border-radius:var(--rs);font-size:14px;padding:9px 12px;font-family:inherit;outline:none;appearance:auto;-webkit-appearance:auto}
.btnp{background:var(--grad);color:#fff;border:none;padding:11px;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:7px;font-family:inherit;box-shadow:0 4px 15px rgba(176,107,255,.3)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:11px 13px;margin-bottom:8px}
.pc{display:flex;align-items:center;gap:10px;padding:11px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);margin-bottom:7px;cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.pi{flex:1}.pn{font-size:13px;font-weight:600}.pm{font-size:11px;color:var(--mt);margin-top:2px}
.stab{background:none;border:1px solid var(--bd);color:var(--mt);padding:7px 14px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s}
.stab.on{background:var(--grad);border-color:transparent;color:#fff}
.btn-sm{background:none;border:1px solid var(--bd);color:var(--mt);padding:6px 11px;border-radius:var(--rs);font-size:12px;cursor:pointer;font-family:inherit}
.back{background:none;border:none;color:var(--mt);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;margin-bottom:12px;padding:0;font-family:inherit}
.btns{background:none;border:1px solid var(--bd);color:var(--tx);padding:7px 14px;border-radius:var(--rs);font-size:13px;cursor:pointer;font-family:inherit}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.mod{background:var(--sf);border-radius:var(--r) var(--r) 0 0;padding:20px 16px 28px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.mod label{font-size:12px;color:var(--mt);display:block;margin:10px 0 3px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:28px 22px;width:100%;max-width:360px;text-align:center}
.login-title{font-size:20px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--mt);margin-bottom:24px}
.pass-wrap{position:relative;margin-bottom:0}
.pass-wrap input{padding-right:44px}
.pass-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mt);cursor:pointer;font-size:18px;padding:4px}
.drive-dot{width:7px;height:7px;border-radius:50%;background:var(--bd);flex-shrink:0;transition:background .3s}
.drive-dot.ok{background:#22c55e}
.drive-dot.saving{background:#f59e0b;animation:dbpulse .8s infinite}
.drive-dot.err{background:#ef4444}
@keyframes dbpulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div style="font-size:36px;margin-bottom:10px">🧠</div>
    <div class="login-title">NeuroAgenda</div>
    <div class="login-sub">Acceso Secretaria</div>
    <label style="text-align:left;font-size:12px;color:var(--mt);display:block;margin-bottom:4px">Usuario</label>
    <input type="text" id="login-user" placeholder="usuario" autocomplete="off" style="margin-bottom:10px">
    <label style="text-align:left;font-size:12px;color:var(--mt);display:block;margin-bottom:4px">Contraseña</label>
    <div class="pass-wrap">
      <input type="password" id="login-pass" placeholder="contraseña" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="pass-eye" onclick="togglePass()" type="button" id="eye-btn">👁</button>
    </div>
    <div id="login-err" style="color:var(--rd);font-size:12px;min-height:20px;margin:8px 0"></div>
    <button class="btnp" onclick="doLogin()">Ingresar</button>
  </div>
</div>

<nav class="nav" id="main-nav" style="display:none">
  <div class="nav-inner">
    <div><div class="brand">Secretari@</div><div class="brand-sub">Dra. Dal Maschio</div></div>
    <button onclick="logout()" style="background:none;border:none;color:var(--mt);font-size:11px;cursor:pointer">Salir</button>
  </div>
  <div style="display:flex;align-items:center;gap:6px;padding:0 14px 6px;font-size:11px;color:var(--mt)">
    <span id="drive-dot" style="width:7px;height:7px;border-radius:50%;background:var(--mt2);display:inline-block"></span>
    <span id="drive-status">Dropbox: listo</span>
    <button id="dbx-connect-btn" onclick="dbxConnect()" style="margin-left:auto;background:none;border:1px solid var(--bd);color:var(--ac);font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;display:none">Conectar Dropbox</button>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="sv('inicio')">Inicio</button>
    <button class="tab" onclick="sv('agenda')">Agenda</button>
    <button class="tab" onclick="sv('pacs')">Pacientes</button>
  </div>
</nav>

<main id="main-app" style="display:none">
  <div id="view-inicio" class="view on">
    <div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none">
      <button class="stab on" data-t="wa" onclick="siTab('wa')">💬 WhatsApp</button>
      <button class="stab" data-t="contactar" onclick="siTab('contactar')">📋 A contactar</button>
      <button class="stab" data-t="llamados" onclick="siTab('llamados')">📞 Llamados</button>
      <button class="stab" data-t="masivo" onclick="siTab('masivo')">📨 Masivo</button>
    </div>
    <div id="si-wa"></div>
    <div id="si-contactar" style="display:none"></div>
    <div id="si-llamados" style="display:none"></div>
    <div id="si-masivo" style="display:none"></div>
  </div>

  <div id="view-agenda" class="view">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button class="btn-sm" onclick="cw(-1)">← Ant.</button>
      <div id="wlbl" style="font-size:13px;font-weight:600;color:var(--ac)"></div>
      <button class="btn-sm" onclick="cw(1)">Sig. →</button>
    </div>
    <div id="ag"></div>
  </div>

  <div id="view-pacs" class="view">
    <input type="text" id="srch-pac" placeholder="Buscar paciente..." oninput="filtrarPacs(this.value)" style="margin-bottom:10px">
    <button class="btnp" style="margin-bottom:10px" onclick="openNewPat()">+ Nuevo paciente</button>
    <div id="pac-lista"></div>
  </div>

  <div id="view-det" class="view">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button class="back" onclick="sv('pacs')">← Volver</button>
      <button class="btns" onclick="openEditPat(currentPatId)">✎ Editar</button>
    </div>
    <div id="det-cont"></div>
    <div style="margin-top:20px;padding-top:14px;border-top:1px dashed var(--bd);display:flex;gap:8px;justify-content:center">
      <button onclick="marcarObito(currentPatId)" style="background:none;border:1px solid #99000055;color:#990000;font-size:12px;padding:7px 16px;border-radius:var(--rs);cursor:pointer">✝ Óbito</button>
      <button onclick="marcarAlta(currentPatId)" style="background:none;border:1px solid rgba(34,211,163,.4);color:var(--gn);font-size:12px;padding:7px 16px;border-radius:var(--rs);cursor:pointer">✓ Alta</button>
    </div>
  </div>
</main>

<div class="ov" id="ov-pat" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="mod">
    <div id="pat-ttl" style="font-size:16px;font-weight:700;margin-bottom:14px">Editar paciente</div>
    <input type="hidden" id="pat-id">
    <label>Nombre y apellido *</label><input type="text" id="pat-nombre" placeholder="Apellido, Nombre">
    <div class="form-row">
      <div><label>DNI</label><input type="text" id="pat-dni"></div>
      <div><label>Fecha nac.</label><input type="text" id="pat-fnac" placeholder="dd/mm/aaaa" inputmode="numeric" oninput="autoSlash(this)" maxlength="10"></div>
    </div>
    <div class="form-row">
      <div><label>Cobertura</label><input type="text" id="pat-cob"></div>
      <div><label>Teléfono</label><input type="text" id="pat-tel" inputmode="tel"></div>
    </div>
    <label>Email</label><input type="text" id="pat-email">
    <label>Dirección</label><input type="text" id="pat-dir">
    <label>Próxima consulta</label><input type="text" id="pat-prox" placeholder="dd/mm/aaaa" inputmode="numeric" oninput="autoSlash(this)" maxlength="10">
    <label>Antecedentes</label><textarea id="pat-antec" style="min-height:60px;resize:vertical"></textarea>
    <label>Medicación actual</label><textarea id="pat-meds" style="min-height:60px;resize:vertical"></textarea>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btnp" style="flex:1;margin-top:0" onclick="savePat()">Guardar</button>
      <button onclick="document.getElementById('ov-pat').classList.remove('on')" style="flex:1;background:none;border:1px solid var(--bd);color:var(--mt);padding:11px;border-radius:var(--rs);font-size:14px;cursor:pointer;font-family:inherit">Cancelar</button>
    </div>
  </div>
</div>

<script>
const DL={"demencia_alzheimer": "Alzheimer", "demencia_vascular": "Demencia vascular", "demencia_frontotemporal": "DFT", "demencia_lewy": "Lewy", "demencia_mixta": "Demencia mixta", "deterioro_cognitivo_leve": "DCL", "parkinson": "Parkinson", "psp": "PSP", "parkinsonismo_otro": "Parkinsonismo", "temblor_esencial": "Temblor esencial", "acv_isquemico": "ACV isqu\u00e9mico", "acv_hemorragico": "ACV hemorr\u00e1gico", "microangiopatia": "Microangiopat\u00eda", "epilepsia": "Epilepsia", "migrana": "Migra\u00f1a", "cefalea_tipo_tension": "Cefalea tensional", "cefalea_otra": "Cefalea otra", "esclerosis_multiple": "EM", "neuropatia": "Neuropat\u00eda", "vertigo_vestibular": "V\u00e9rtigo", "paralisis_cerebral": "PC / Retraso", "trastorno_sueno": "Trastorno sue\u00f1o", "neurooncologia": "Neurooncolog\u00eda", "distonia_movimiento": "Diston\u00eda", "sin_diagnostico": "Sin diagn\u00f3stico"};
const DC={"demencia_alzheimer": "#7C3AED", "demencia_vascular": "#6D28D9", "demencia_frontotemporal": "#5B21B6", "demencia_lewy": "#4C1D95", "demencia_mixta": "#8B5CF6", "deterioro_cognitivo_leve": "#A78BFA", "parkinson": "#0369A1", "psp": "#0284C7", "parkinsonismo_otro": "#38BDF8", "temblor_esencial": "#7DD3FC", "acv_isquemico": "#DC2626", "acv_hemorragico": "#991B1B", "microangiopatia": "#F87171", "epilepsia": "#D97706", "migrana": "#059669", "cefalea_tipo_tension": "#10B981", "cefalea_otra": "#6EE7B7", "esclerosis_multiple": "#0891B2", "neuropatia": "#0E7490", "vertigo_vestibular": "#164E63", "paralisis_cerebral": "#B45309", "trastorno_sueno": "#92400E", "neurooncologia": "#BE185D", "distonia_movimiento": "#9D174D", "sin_diagnostico": "#6B7280"};
const ATPL_VIEJO={"1":{"label":"Lunes","turnos":[{"hora":"09:00","tipo":"presencial"},{"hora":"09:45","tipo":"presencial"},{"hora":"10:30","tipo":"presencial"},{"hora":"11:15","tipo":"presencial"},{"hora":"12:00","tipo":"presencial"},{"hora":"15:00","tipo":"video"}]},"2":{"label":"Martes","turnos":[{"hora":"09:00","tipo":"video"},{"hora":"09:45","tipo":"video"},{"hora":"10:30","tipo":"video"},{"hora":"18:00","tipo":"video"}]},"4":{"label":"Jueves","turnos":[{"hora":"09:00","tipo":"video"},{"hora":"09:45","tipo":"video"},{"hora":"10:30","tipo":"video"}]},"5":{"label":"Viernes","turnos":[{"hora":"09:00","tipo":"video"},{"hora":"09:45","tipo":"video"},{"hora":"10:30","tipo":"video"},{"hora":"13:00","tipo":"presencial"},{"hora":"13:45","tipo":"presencial"},{"hora":"14:30","tipo":"presencial"},{"hora":"15:15","tipo":"presencial"}]}};
const ATPL_NUEVO={"1":{"label":"Lunes","turnos":[{"hora":"08:00","tipo":"presencial"},{"hora":"08:45","tipo":"presencial"},{"hora":"09:30","tipo":"presencial"},{"hora":"10:15","tipo":"presencial"},{"hora":"11:00","tipo":"presencial"},{"hora":"11:45","tipo":"presencial"},{"hora":"13:00","tipo":"presencial"},{"hora":"13:45","tipo":"presencial"},{"hora":"14:30","tipo":"presencial"},{"hora":"15:15","tipo":"presencial"}]},"2":{"label":"Martes","turnos":[{"hora":"09:00","tipo":"video"},{"hora":"09:45","tipo":"video"},{"hora":"10:30","tipo":"video"},{"hora":"18:00","tipo":"video"}]},"4":{"label":"Jueves","turnos":[{"hora":"08:00","tipo":"presencial"},{"hora":"08:45","tipo":"presencial"},{"hora":"09:30","tipo":"presencial"},{"hora":"10:15","tipo":"presencial"},{"hora":"11:00","tipo":"presencial"},{"hora":"16:00","tipo":"video"}]},"5":{"label":"Viernes","turnos":[{"hora":"15:00","tipo":"video"},{"hora":"15:45","tipo":"video"}]}};
function ATPL_PARA(fecha){
  // fecha: objeto Date o string dk "YYYY-MM-DD"
  let d=fecha instanceof Date?fecha:new Date((fecha||'').replace(/-/g,'/'));
  return(d.getFullYear()>2026||(d.getFullYear()===2026&&d.getMonth()>=8))?ATPL_NUEVO:ATPL_VIEJO;
}
const ATPL=ATPL_PARA(new Date());

const S=(k,v)=>{try{localStorage.setItem('na4_'+k,JSON.stringify(v));}catch(e){}if(typeof dbxScheduleSave==='function')dbxScheduleSave();};
const L=(k,d)=>{try{const v=localStorage.getItem('na4_'+k);return v?JSON.parse(v):d;}catch(e){return d;}};

let extraPats=L('ep',[]),patEdits=L('pe',{}),notas2=L('n2',{}),turnos=L('tu',{}),nextApps=L('napp',{}),waEnviados=L('wa_env',{});
let dxPropio=L('dxp',{}),dxIA=L('dxi',{}),cobros=L('co',[]);
let currentPatId=null,wo=0;

// Sin PTS_BASE — usamos extraPats + patEdits + nombres de cobros/turnos
function getPatById(id){
  const ep=extraPats.find(p=>p.id===id);
  if(ep){const e=patEdits[id]||{};return{...ep,...e};}
  // Paciente base: reconstruir desde patEdits
  if(patEdits[id]){
    const e=patEdits[id];
    if(e._deleted)return null;
    return{id,...e,nombre:e.nombre||id};
  }
  return null;
}
function allPats(){
  const extra=extraPats.filter(p=>!p._deleted).map(p=>{const e=patEdits[p.id]||{};return{...p,...e};});
  const baseEdited=Object.entries(patEdits)
    .filter(([id,e])=>!id.startsWith('new_')&&!e._deleted&&e.nombre)
    .map(([id,e])=>({id,...e}));
  const baseIds=new Set(extra.map(p=>p.id));
  const merged=[...extra,...baseEdited.filter(p=>!baseIds.has(p.id))];
  return merged;
}
function getPat(id){return getPatById(id)||allPats().find(p=>p.id===id)||null;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const COLORS=['#A855F7','#EC4899','#38BDF8','#10B981','#F59E0B','#EF4444','#818CF8'];
function pcolor(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%COLORS.length;return COLORS[h];}
function ini(id){const p=getPat(id);const n=(p?.nombre||id).split(',');return((n[1]||n[0]||'').trim()[0]||(n[0]||'')[0]||'?').toUpperCase();}
function autoSlash(inp){let v=inp.value.replace(/\D/g,'');if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);if(v.length>5)v=v.slice(0,5)+'/'+v.slice(5);if(v.length>10)v=v.slice(0,10);inp.value=v;}

// AUTH
function togglePass(){const inp=document.getElementById('login-pass');const btn=document.getElementById('eye-btn');if(inp.type==='password'){inp.type='text';btn.textContent='🙈';}else{inp.type='password';btn.textContent='👁';}}
function doLogin(){
  const user=document.getElementById('login-user').value.trim();
  const pass=document.getElementById('login-pass').value;
  const okUser=localStorage.getItem('sec_user')||'sofia';
  const okPass=localStorage.getItem('sec_pass')||'sofia2024';
  if(user===okUser&&pass===okPass){localStorage.setItem('sec_session','1');iniciarApp();}
  else{document.getElementById('login-err').textContent='Usuario o contraseña incorrectos';document.getElementById('login-pass').value='';}
}
function logout(){if(confirm('¿Cerrar sesión?')){localStorage.removeItem('sec_session');location.reload();}}
function iniciarApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-nav').style.display='';
  document.getElementById('main-app').style.display='';
  buildInicio();buildAg();filtrarPacs('');
  updateDbxConnectBtn();
  dbxRestoreIfNeeded();
  if(!window._dbxPullInterval)window._dbxPullInterval=setInterval(dbxRestoreIfNeeded,45000);
}
window.onload=function(){
  dbxHandleRedirect();
  if(localStorage.getItem('sec_session')==='1')iniciarApp();
};

// NAV
function sv(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  document.getElementById('view-'+v)?.classList.add('on');
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['inicio','agenda','pacs'][i]===v));
  window.scrollTo(0,0);
}

// INICIO TABS
function siTab(t){
  document.querySelectorAll('.stab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['wa','contactar','llamados','masivo'].forEach(s=>{document.getElementById('si-'+s).style.display=s===t?'':'none';});
  ({wa:buildSiWA,contactar:buildSiContactar,llamados:buildSiLlamados,masivo:buildSiMasivo})[t]?.();
}
function buildInicio(){buildSiWA();}

function buildSiWA(){
  const hoy=new Date();
  const items=Object.entries(nextApps).map(([id,fecha])=>{
    const p=getPat(id);
    const nombre=p?.nombre||(cobros.find(c=>c.pacienteId===id)?.pacienteNombre)||id;
    if(!nombre||nombre===id)return null;
    const pa=fecha.split('/');const d=pa.length===3?new Date(+pa[2],+pa[1]-1,+pa[0]):null;if(!d)return null;
    const diff=Math.round((d-hoy)/(1000*60*60*24));
    const tel=p?.telefono||(cobros.find(c=>c.pacienteId===id)?.tel)||'';
    return{id,nombre,fecha,diff,sent:waEnviados[id],tel};
  }).filter(Boolean).sort((a,b)=>a.diff-b.diff);
  const el=document.getElementById('si-wa');
  if(!items.length){el.innerHTML='<div style="color:var(--mt);padding:20px 0;font-size:13px">Sin pacientes con fecha asignada</div>';return;}
  el.innerHTML='<div class="sec-ttl">Recordatorios ('+items.length+')</div>'+items.map(x=>{
    const color=x.diff<0?'var(--rd)':x.diff===0?'var(--am)':'var(--gn)';
    const label=x.diff<0?'Venció hace '+Math.abs(x.diff)+'d':x.diff===0?'Hoy'    <input type="text" id="srch-pac" placeholder="Buscar paciente..." oninput="filtrarPacs(this.value)" style="margin-bottom:10px">
    <button class="btnp" style="margin-bottom:10px" onclick="openNewPat()">+ Nuevo paciente</button>
    <div id="pac-lista"></div>
  </div>

  <div id="view-det" class="view">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button class="back" onclick="sv('pacs')">← Volver</button>
      <button class="btns" onclick="openEditPat(currentPatId)">✎ Editar</button>
    </div>
    <div id="det-cont"></div>

// Sin PTS_BASE — usamos extraPats + patEdits + nombres de cobros/turnos
function getPatById(id){
  const ep=extraPats.find(p=>p.id===id);
  if(ep){const e=patEdits[id]||{};return{...ep,...e};}
  // Paciente base: reconstruir desde patEdits
  if(patEdits[id]){
    const e=patEdits[id];
    if(e._deleted)return null;
    return{id,...e,nombre:e.nombre||id};
  }
  return null;
}
function allPats(){
  const extra=extraPats.filter(p=>!p._deleted).map(p=>{const e=patEdits[p.id]||{};return{...p,...e};});
  const baseEdited=Object.entries(patEdits)
    .filter(([id,e])=>!id.startsWith('new_')&&!e._deleted&&e.nombre)
    .map(([id,e])=>({id,...e}));
  const baseIds=new Set(extra.map(p=>p.id));
  const merged=[...extra,...baseEdited.filter(p=>!baseIds.has(p.id))];
  return merged;
}
function getPat(id){return getPatById(id)||allPats().find(p=>p.id===id)||null;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function pcolor(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%COLORS.length;return COLORS[h];}

function buildSiWA(){
  const hoy=new Date();

    return{id,nombre,fecha,diff,sent:waEnviados[id],tel};

function buildSiContactar(){

  const sinContactar=Object.values(mapPac).filter(p=>!idsConFecha.has(p.id)&&!idsConWA.has(p.id));

}

function enviarMasivo(id){
  const p=getPat(id);const nombre=(p?.nombre||(cobros.find(c=>c.pacienteId===id)?.pacienteNombre)||'').split(',')[0].trim();

  const pats=allPats().filter(p=>!q||p.nombre?.toLowerCase().includes(q.toLowerCase()));

  if(!pats.length){lista.innerHTML='<div style="color:var(--mt);font-size:13px;padding:16px 0">Sin pacientes'+(q?' que coincidan':'')+'</div>';return;}

    return '<div class="pc" onclick="verPat(\'+p.id+\')"><div class="av" style="background:'+c+'22;color:'+c+'">'+(p.nombre||'?')[0].toUpperCase()+'</div><div class="pi"><div class="pn">'+esc(p.nombre||p.id)+(p.obito?' <span style="color:#cc0000;font-size:10px;font-weight:800">ÓBITO</span>':'')+(p.alta?' <span style="color:var(--gn);font-size:10px;font-weight:800">ALTA</span>':'')+'</div><div class="pm">'+(p.cobertura||'Sin cobertura')+(prox?' · 📅 '+prox:'')+'</div></div></div>';

function verPat(id){
  currentPatId=id;const p=getPat(id);if(!p)return;
  const ns=notas2[id]||[];const prox=nextApps[id]||'';
  let h='<div style="font-size:18px;font-weight:700;margin-bottom:4px">'+esc(p.nombre||id)+(p.obito?' <span style="color:#cc0000;font-size:12px">ÓBITO</span>':'')+(p.alta?' <span style="color:var(--gn);font-size:12px">ALTA</span>':'')+'</div>';
  if(p.cobertura||p.telefono)h+='<div style="font-size:12px;color:var(--mt);margin-bottom:12px">'+(p.cobertura||'')+(p.telefono?' · 📱 '+p.telefono:'')+'</div>';
  [['DNI',p.dni],['Fecha nac.',p.fecha_nac],['Email',p.email],['Dirección',p.direccion]].forEach(([l,v])=>{if(v)h+='<div style="font-size:12px;margin-bottom:4px"><span style="color:var(--mt)">'+l+':</span> '+esc(v)+'</div>';});
  h+='<div style="background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:10px;color:var(--mt2);text-transform:uppercase;letter-spacing:.5px">Próxima consulta</div><div style="font-size:14px;font-weight:600;color:'+(prox?'var(--ac)':'var(--mt)')+'">'+( prox||'Sin fecha')+'</div></div><div style="display:flex;gap:6px"><button onclick="editarProxima(\'+id+\')" style="background:none;border:1px solid var(--bd);color:var(--mt);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer">✎</button>'+(p.telefono?'<button onclick="enviarWA(\'+id+\')" style="background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.35);color:#25D366;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">WA</button>':'')+'</div></div>';
  if(p.antecedentes)h+='<div class="card"><div style="font-size:10px;color:var(--mt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Antecedentes</div><div style="font-size:13px">'+esc(p.antecedentes)+'</div></div>';
  if(p.medicacion_actual||p.medicacion)h+='<div class="card"><div style="font-size:10px;color:var(--mt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Medicación</div><div style="font-size:13px">'+esc(p.medicacion_actual||p.medicacion||'')+'</div></div>';
  if(ns.length){h+='<div class="sec-ttl">Historial de consultas</div>'+ns.slice(0,5).map(n=>'<div class="card"><div style="font-size:10px;color:var(--mt2);margin-bottom:5px">'+esc(n.fecha||'')+'</div><div style="font-size:13px;line-height:1.5">'+esc(n.texto||n.nota||'')+'</div></div>').join('');if(ns.length>5)h+='<div style="font-size:12px;color:var(--mt);text-align:center;padding:6px">+ '+(ns.length-5)+' más</div>';}
  document.getElementById('det-cont').innerHTML=h;sv('det');
}

function editarProxima(id){
  const actual=nextApps[id]||'';const val=prompt('Próxima consulta (dd/mm/aaaa):\nVacío para borrar',actual);
  if(val===null)return;
  if(val.trim()){const pp=val.trim().split('/');nextApps[id]=pp.length===3&&pp[2].length===2?pp[0]+'/'+pp[1]+'/20'+pp[2]:val.trim();}
  else delete nextApps[id];
  S('napp',nextApps);verPat(id);
}

function openEditPat(id){
  const p=getPat(id);if(!p)return;
  document.getElementById('pat-ttl').textContent='Editar paciente';
  document.getElementById('pat-id').value=id;
  document.getElementById('pat-nombre').value=p.nombre||'';
  document.getElementById('pat-dni').value=p.dni||'';
  document.getElementById('pat-fnac').value=p.fecha_nac||'';
  document.getElementById('pat-cob').value=p.cobertura||'';
  document.getElementById('pat-tel').value=p.telefono||'';
  document.getElementById('pat-email').value=p.email||'';
  document.getElementById('pat-dir').value=p.direccion||'';
  document.getElementById('pat-prox').value=nextApps[id]||'';
  document.getElementById('pat-antec').value=p.antecedentes||'';
  document.getElementById('pat-meds').value=p.medicacion_actual||p.medicacion||'';

}
function openNewPat(){
  document.getElementById('pat-ttl').textContent='Nuevo paciente';
  ['pat-id','pat-nombre','pat-dni','pat-fnac','pat-cob','pat-tel','pat-email','pat-dir','pat-prox','pat-antec','pat-meds'].forEach(i=>{const el=document.getElementById(i);if(el)el.value='';});
  document.getElementById('ov-pat').classList.add('on');
  setTimeout(()=>document.getElementById('pat-nombre').focus(),80);
}
function savePat(){
  const id=document.getElementById('pat-id').value;
  const nombre=document.getElementById('pat-nombre').value.trim();
  if(!nombre){alert('El nombre es obligatorio');return;}
  const campos={nombre,dni:document.getElementById('pat-dni').value.trim(),fecha_nac:document.getElementById('pat-fnac').value.trim(),cobertura:document.getElementById('pat-cob').value.trim(),telefono:document.getElementById('pat-tel').value.trim(),email:document.getElementById('pat-email').value.trim(),direccion:document.getElementById('pat-dir').value.trim(),antecedentes:document.getElementById('pat-antec').value.trim(),medicacion_actual:document.getElementById('pat-meds').value.trim()};
  const proxRaw=document.getElementById('pat-prox').value.trim();
  const realId=id||'new_'+Date.now();
  if(proxRaw){const pp=proxRaw.split('/');nextApps[realId]=pp.length===3&&pp[2].length===2?pp[0]+'/'+pp[1]+'/20'+pp[2]:proxRaw;S('napp',nextApps);}
  if(id){
    if(id.startsWith('new_')){const i=extraPats.findIndex(e=>e.id===id);if(i!==-1)Object.assign(extraPats[i],campos);S('ep',extraPats);}
    else{if(!patEdits[id])patEdits[id]={};Object.assign(patEdits[id],campos);S('pe',patEdits);}
  }else{
    extraPats.push({id:realId,...campos,diagnostico:'sin_diagnostico'});S('ep',extraPats);
  }
  document.getElementById('ov-pat').classList.remove('on');
  filtrarPacs('');if(id)verPat(id);else sv('pacs');
  const t=document.createElement('div');t.textContent='✓ Guardado';t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--grad);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999';document.body.appendChild(t);setTimeout(()=>document.body.removeChild(t),2000);
}

function marcarObito(id){const p=getPat(id);if(!p)return;const ya=p.obito;if(!confirm(ya?'¿Quitar Óbito?':'¿Marcar como Óbito?'))return;if(id.startsWith('new_')){const i=extraPats.findIndex(e=>e.id===id);if(i!==-1){extraPats[i].obito=!ya;S('ep',extraPats);}}else{if(!patEdits[id])patEdits[id]={};patEdits[id].obito=!ya;S('pe',patEdits);}verPat(id);}
function marcarAlta(id){const p=getPat(id);if(!p)return;const ya=p.alta;if(!confirm(ya?'¿Quitar Alta?':'¿Marcar como Alta?'))return;if(id.startsWith('new_')){const i=extraPats.findIndex(e=>e.id===id);if(i!==-1){extraPats[i].alta=!ya;S('ep',extraPats);}}else{if(!patEdits[id])patEdits[id]={};patEdits[id].alta=!ya;S('pe',patEdits);}verPat(id);}

// AGENDA
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function cw(n){wo+=n;buildAg();}
function buildAg(){
  const base=new Date();base.setDate(base.getDate()+wo*7);
  const mon=new Date(base);mon.setDate(base.getDate()-((base.getDay()+6)%7));
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  document.getElementById('wlbl').textContent=mon.toLocaleDateString('es-AR',{day:'numeric',month:'short'})+' – '+fri.toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'});
  const hoy=dk(new Date());let html='';
  const dias=['','Lunes','Martes','Miércoles','Jueves','Viernes'];
  [1,2,3,4,5].forEach(d=>{
    const dd=new Date(mon);dd.setDate(mon.getDate()+(d-1));
    const dkk=dk(dd);const tpl=ATPL_PARA(dd)[String(d)];if(!tpl)return;
    const sd=turnos[dkk]||{};const isH=dkk===hoy;
    html+='<div style="background:var(--sf);border:1px solid '+(isH?'var(--ac)':'var(--bd)')+';border-radius:var(--rs);margin-bottom:10px">';
    html+='<div style="padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between"><div style="font-size:13px;font-weight:700;color:'+(isH?'var(--ac)':'var(--tx)')+'">'+dias[d]+(isH?' · Hoy':'')+'</div><div style="font-size:12px;color:var(--mt)">'+dd.toLocaleDateString('es-AR',{day:'numeric',month:'long'})+'</div></div>';
    tpl.turnos.forEach(sl=>{
      const a=sd[sl.hora];
      html+='<div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--bd)"><div style="font-size:13px;font-weight:700;color:var(--ac);min-width:44px">'+sl.hora+'</div><div style="font-size:11px">'+(sl.tipo==='video'?'📹':'🏥')+'</div><div style="flex:1;font-size:13px;'+(a?'':'color:var(--mt2)')+'">'+( a?esc(a.pacienteNombre):'Libre')+'</div>'+(a&&a.pacienteId?'<button onclick="verPat(\'+a.pacienteId+\')" style="background:none;border:1px solid var(--bd);color:var(--mt);padding:3px 8px;border-radius:6px;font-size:11px;cursor:pointer">Ficha</button>':'')+'</div>';
    });
    html+='</div>';
  });
  document.getElementById('ag').innerHTML=html||'<div style="color:var(--mt);text-align:center;padding:30px">Sin turnos esta semana</div>';
}

// ═══════════════════════════════════════════════════════════
//  DROPBOX AUTO-SYNC — comparte el archivo /NeuroAgenda_backup.json
//  con la app principal de la doctora. Solo escribe los campos que
//  esta app maneja (pacientes, próximas consultas, WA enviados,
//  llamados) y conserva intactos los demás (notas clínicas, finanzas, etc.)
// ═══════════════════════════════════════════════════════════
const DBX_APP_KEY = '9iy6bt4bd3nyzzy';
const DBX_REDIRECT_URI = 'https://dradalmaschio.github.io/neuroagenda/';
const DBX_PATH = '/NeuroAgenda_backup.json';
let dbxSaveTimer = null, dbxSaving = false, dbxPulling = false;

function dbxSetStatus(state, msg){
  const dot = document.getElementById('drive-dot');
  const status = document.getElementById('drive-status');
  if(!dot || !status) return;
  dot.className = 'drive-dot ' + (state||'');
  status.textContent = msg;
}
function dbxIsConnected(){
  const token = localStorage.getItem('dbx_access_token');
  const exp = +(localStorage.getItem('dbx_access_token_exp')||0);
  return !!token && Date.now() < exp;
}
function updateDbxConnectBtn(){
  const btn = document.getElementById('dbx-connect-btn');
  if(!btn) return;
  if(dbxIsConnected()){ btn.style.display='none'; }
  else{ btn.style.display='inline-block'; btn.textContent = localStorage.getItem('dbx_access_token') ? '🔄 Reconectar Dropbox' : 'Conectar Dropbox'; }
}
function dbxConnect(){
  const state = Math.random().toString(36).slice(2);
  localStorage.setItem('dbx_oauth_state', state);
  const params = new URLSearchParams({client_id: DBX_APP_KEY, response_type: 'token', redirect_uri: DBX_REDIRECT_URI, state: state});
  window.location.href = 'https://www.dropbox.com/oauth2/authorize?' + params.toString();
}
function dbxHandleRedirect(){
  const hash = window.location.hash;
  if(!hash || !hash.includes('access_token')) return;
  const params = new URLSearchParams(hash.slice(1));
  const token = params.get('access_token');
  const expiresIn = +(params.get('expires_in') || 14400);
  const state = params.get('state');
  window.history.replaceState({}, '', window.location.pathname);
  if(!token){ dbxSetStatus('err','No se recibió el token de Dropbox'); return; }
  const savedState = localStorage.getItem('dbx_oauth_state');
  if(state && savedState && state !== savedState){ dbxSetStatus('err','Error de seguridad — reintentá'); return; }
  localStorage.removeItem('dbx_oauth_state');
  localStorage.setItem('dbx_access_token', token);
  localStorage.setItem('dbx_access_token_exp', String(Date.now() + (expiresIn * 1000) - 600000));
  dbxSetStatus('ok','Dropbox: conectado ✓');
  updateDbxConnectBtn();
}
async function getDbxAccessToken(){
  const token = localStorage.getItem('dbx_access_token');
  const exp = +(localStorage.getItem('dbx_access_token_exp')||0);
  if(token && Date.now() < exp) return token;
  dbxSetStatus('err','Dropbox: sesión vencida — tocá Reconectar');
  updateDbxConnectBtn();
  return null;
}
async function dbxFetchRemote(token){
  try{
    const res = await fetch('https://content.dropboxapi.com/2/files/download', {
      method:'POST',
      headers:{'Authorization':'Bearer '+token,'Dropbox-API-Arg':JSON.stringify({path:DBX_PATH})}
    });
    if(!res.ok) return {};
    return await res.json();
  }catch(e){ return {}; }
}
// Campos que ESTA app puede modificar. El resto del archivo (notas clínicas,
// diagnósticos, finanzas, imágenes) se preserva tal cual venga de Dropbox.
function buildBackupPayloadSec(){
  return {
    extraPats: L('ep',[]), patEdits: L('pe',{}), nextApps: L('napp',{}),
    waEnviados: L('wa_env',{}), secLlamados: L('sec_llamados',[])
  };
}
async function dbxSaveNow(){
  if(dbxSaving) return;
  if(!dbxIsConnected()){ dbxSetStatus('err','Dropbox: no conectado'); updateDbxConnectBtn(); return; }
  dbxSaving = true;
  dbxSetStatus('saving','Guardando en Dropbox...');
  try{
    const token = await getDbxAccessToken();
    if(!token){ dbxSetStatus('err','No se pudo renovar la conexión'); dbxSaving=false; return; }
    const remote = await dbxFetchRemote(token);
    const merged = Object.assign({}, remote, buildBackupPayloadSec(), {version:5, fecha:new Date().toISOString()});
    const res = await fetch('https://content.dropboxapi.com/2/files/upload', {
      method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/octet-stream',
        'Dropbox-API-Arg':JSON.stringify({path:DBX_PATH, mode:'overwrite', autorename:false, mute:true})},
      body: JSON.stringify(merged)
    });
    if(res.ok){
      localStorage.setItem('dbx_last_fecha', merged.fecha);
      const now = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
      dbxSetStatus('ok','Dropbox: guardado ' + now + ' ✓');
    } else {
      dbxSetStatus('err','Error al guardar en Dropbox');
    }
  }catch(e){ dbxSetStatus('err','Sin conexión'); }
  dbxSaving = false;
}
function dbxScheduleSave(){ clearTimeout(dbxSaveTimer); dbxSaveTimer = setTimeout(dbxSaveNow, 2000); }

// Trae lo último de Dropbox (pacientes, agenda, llamados, etc.) si cambió desde la última vez
async function dbxRestoreIfNeeded(){
  updateDbxConnectBtn();
  if(!dbxIsConnected()){ dbxSetStatus('err','Dropbox: no conectado'); return; }
  if(dbxPulling || dbxSaving) return;
  dbxPulling = true;
  try{
    const token = await getDbxAccessToken();
    if(!token){ dbxPulling=false; return; }
    const data = await dbxFetchRemote(token);
    if(!data.version){ dbxSetStatus('ok','Dropbox: listo ✓'); dbxPulling=false; return; }
    const remoteFecha = data.fecha || '';
    const localFecha = localStorage.getItem('dbx_last_fecha') || '';
    if(remoteFecha && remoteFecha === localFecha){ dbxSetStatus('ok','Dropbox: activo ✓'); dbxPulling=false; return; }

    S('ep',data.extraPats||[]); S('pe',data.patEdits||{}); S('n2',data.notas2||{}); S('tu',data.turnos||{});
    S('napp',data.nextApps||{}); S('wa_env',data.waEnviados||{}); S('sec_llamados',data.secLlamados||[]);
    S('dxp',data.dxPropio||{}); S('dxi',data.dxIA||{}); S('co',data.cobros||[]);
    extraPats=L('ep',[]); patEdits=L('pe',{}); notas2=L('n2',{}); turnos=L('tu',{});
    nextApps=L('napp',{}); waEnviados=L('wa_env',{}); dxPropio=L('dxp',{}); dxIA=L('dxi',{}); cobros=L('co',[]);
    if(remoteFecha) localStorage.setItem('dbx_last_fecha', remoteFecha);

    dbxSetStatus('ok','Dropbox: sincronizado ✓');
    if(document.getElementById('main-app')?.style.display!=='none'){
      buildInicio();buildAg();filtrarPacs('');
    }
  }catch(e){ dbxSetStatus('ok','Dropbox: listo ✓'); }
  dbxPulling = false;
}
</script>
